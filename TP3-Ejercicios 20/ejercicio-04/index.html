<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ejercicio 4 - Formulario</title></head>
<body>
<main>
<h1>Formulario de contacto</h1>
<form action="#" method="post">
  <div><label for="nombre">Nombre:</label><input id="nombre" name="nombre" type="text" required></div>
  <div><label for="email">Email:</label><input id="email" name="email" type="email" required></div>
  <div><label for="mensaje">Mensaje:</label><textarea id="mensaje" name="mensaje" rows="6" required></textarea></div>
  <button type="submit">Enviar</button>
</form>
</main>
</body>
</html>
